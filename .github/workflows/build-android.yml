name: Build & Release KP3 An Phu Android App (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android APK & AAB (Galaxy S25 / Android 16 Ready)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses (Built-in Ubuntu Runner SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install dependencies & Build Web Portal (Full 14 Modules)
        env:
          VITE_SUPABASE_URL: "https://wjdgaobhipkgzveidtra.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqZGdhb2JoaXBrZ3p2ZWlkdHJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NTk0MzQsImV4cCI6MjEwNzQzNTQzNH0.7fw6blUWmBm9lJ-tfazcGEsr20KOT6Qn1ytSZk_CMtU"
        run: |
          npm ci --legacy-peer-deps || npm install
          npm run build
          npx cap sync android

      - name: Generate Keystore in android/app & Build V1+V2+V3 Signed APK + AAB
        working-directory: android
        run: |
          chmod +x gradlew
          rm -f app/kp3-release.jks
          keytool -genkeypair -v \
            -keystore app/kp3-release.jks \
            -alias kp3anphu \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kp3anphu2026 \
            -keypass kp3anphu2026 \
            -dname "CN=Ban Dieu Hanh Khu Pho 3, OU=Phuong An Phu, O=TP Ho Chi Minh, L=TP Ho Chi Minh, ST=HCM, C=VN"

          test -f app/kp3-release.jks
          ./gradlew clean assembleRelease bundleRelease

          mkdir -p ../release-artifacts
          # Chỉ lấy APK đã ký số (không lấy bản unsigned!)
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Fallback apksigner manual signing..."
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            ZIPALIGN_BIN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" | sort -V | tail -n 1)
            APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
            "$ZIPALIGN_BIN" -v -p 4 "$UNSIGNED_APK" ../release-artifacts/KP3-AnPhu-aligned.apk
            "$APKSIGNER_BIN" sign \
              --ks app/kp3-release.jks \
              --ks-key-alias kp3anphu \
              --ks-pass pass:kp3anphu2026 \
              --key-pass pass:kp3anphu2026 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out ../release-artifacts/KP3-AnPhu.apk \
              ../release-artifacts/KP3-AnPhu-aligned.apk
            rm -f ../release-artifacts/KP3-AnPhu-aligned.apk
          else
            cp "$APK_PATH" ../release-artifacts/KP3-AnPhu.apk
          fi

          # Xác minh chữ ký số V1 + V2 + V3 bắt buộc thành công trước khi phát hành!
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs ../release-artifacts/KP3-AnPhu.apk

          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$AAB_PATH" ../release-artifacts/KP3-AnPhu.aab
          ls -lh ../release-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KP3-AnPhu-Android-Signed-v1.1.0
          path: release-artifacts/*

      - name: Publish Official GitHub Release (Signed KP3-AnPhu.apk v1.1.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.0
          name: "Ứng dụng Android Khu phố 3 – Phường An Phú (Bản Đầy Đủ v1.1.0 – Signed S25 Ready)"
          body: |
            ### 📱 Ứng dụng Android Chính thức: Khu phố 3 – Phường An Phú, TP. Hồ Chí Minh (v1.1.0)
            - **Package ID:** `vn.tphcm.anphu.khupho3` (`versionCode: 2`, `targetSdk: 36`)
            - **Chữ ký số:** Đã xác thực **APK Signature Scheme V1 + V2 + V3** (tương thích hoàn toàn Samsung Galaxy S25 / Android 15–16).
            - **Tải cài đặt trực tiếp:** Tải file **`KP3-AnPhu.apk`** bên dưới. *(Lưu ý trên dòng Samsung S24/S25: nếu bật "Trình tự động chặn / Auto Blocker" trong Cài đặt → Bảo mật và riêng tư, vui lòng tạm tắt khi cài APK ngoài CH Play).*
          files: |
            release-artifacts/KP3-AnPhu.apk
            release-artifacts/KP3-AnPhu.aab
          draft: false
          prerelease: false
          make_latest: "true"
